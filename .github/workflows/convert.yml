
name: Convert APKS to APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Download APKEditor
        run: |
          URL=$(curl -fsSL \
            https://api.github.com/repos/REAndroid/APKEditor/releases/latest \
            | jq -r '[.assets[] | select(.name | endswith(".jar"))][0].browser_download_url')
          test "$URL" != "null"
          curl -fL "$URL" -o APKEditor.jar


      - name: Convert
        run: |
          FILE=$(find . -type f -iname '*.apks' -not -path './.git/*' -print -quit)
          if [ -z "$FILE" ]; then
            echo "ERROR: No APKS file found in repository"
            find . -maxdepth 3 -type f
            exit 1
          fi
          echo "Found: $FILE"
          java -jar APKEditor.jar m -i "$FILE" -o Haroun.apk


      - name: Convert
        run: |
          FILE=$(find . -maxdepth 1 -name '*.apks' -print -quit)
          test -n "$FILE"
          java -jar APKEditor.jar m -i "$FILE" -o Haroun.apk


      - name: Publish APK Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "converted-${GITHUB_RUN_NUMBER}" \
            Haroun.apk \
            --title "Haroun APK" \
            --notes "Converted from APKS"
